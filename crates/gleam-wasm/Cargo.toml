[package]
name = "gleam-wasm"
version = "0.2.0"
edition = "2024"
description = "Direct Gleam-to-Wasm GC compiler backend"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
wast = "59"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1"
proptest = "1"
wasmparser = "0.262.0"
