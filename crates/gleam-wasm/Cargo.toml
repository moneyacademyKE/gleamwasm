[package]
name = "gleam-wasm"
version = "0.2.0"
edition = "2024"
description = "Direct Gleam-to-Wasm GC compiler backend"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
wast = "59"
gleam-core = { git = "https://github.com/gleam-lang/gleam", tag = "v1.18.1", optional = true }
camino = { version = "1", optional = true }

[dev-dependencies]
insta = "1"
proptest = "1"

[features]
default = []
gleam-frontend = ["dep:gleam-core", "dep:camino"]
